name: Claude Review

# Automated PR review by the Claude Code GitHub Action.
# Requires a `CLAUDE_CODE_OAUTH_TOKEN` secret — generate it with `claude setup-token`
# (Claude Pro/Max). Skips fork PRs, which can't access secrets.

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review this pull request to a Claude Code plugin. Check, in order:
            1. The manifests (.claude-plugin/plugin.json, .claude-plugin/marketplace.json)
               and plugin-mcp.json stay valid and consistent — e.g. `version` is bumped in
               BOTH plugin.json and marketplace.json when behaviour changes.
            2. The command (commands/) and skill (skills/) reference tool names that match
               the bundled @myarchitectai/mcp server, with sensible `allowed-tools`.
            3. No secrets or API keys are committed.
            4. A CHANGELOG.md [Unreleased] entry exists for user-facing changes (suggest
               the exact line if it's missing).
            Post specific, actionable inline comments on the relevant lines. If the PR is
            solid, say so in one line.
          claude_args: |
            --max-turns 10
            --model claude-sonnet-4-6
